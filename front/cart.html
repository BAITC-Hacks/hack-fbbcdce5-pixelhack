<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Локальная корзина — Электрокомплект</title><link rel="stylesheet" href="style.css" /></head>
<body><main class="cart-page"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">E</span><span>Электрокомплект</span></a><a class="cart-home-link" href="/"><span class="cart-home-arrow" aria-hidden="true">←</span><span>Вернуться на главную</span></a></header><section class="cart-content"><p class="eyebrow">Корзина прототипа</p><h1>Локальная корзина</h1><p id="cart-notice">Загружаем корзину…</p><div id="cart-items" class="cart-items"></div></section></main><script>
(() => { "use strict"; const state = (() => { try { return JSON.parse(sessionStorage.getItem("ekt-ai-session")); } catch { return null; } })(); const notice = document.querySelector("#cart-notice"), list = document.querySelector("#cart-items"); const text = (tag, value) => { const node = document.createElement(tag); node.textContent = value; return node; }; if (!state?.session_id || !state?.access_token) { notice.textContent = "Нет активной сессии. Вернитесь в чат, чтобы создать её."; return; } fetch(`/api/v1/sessions/${state.session_id}/cart`, { headers: { Authorization: `Bearer ${state.access_token}` } }).then(async response => { const data = await response.json(); if (!response.ok) throw new Error(data?.error?.message || "Не удалось получить корзину."); notice.textContent = data.notice; if (!data.items.length) { const empty = text("div", "Корзина пока пуста. Добавление требует отдельного подтверждения в чате."); empty.className = "empty-state"; list.append(empty); return; } for (const item of data.items) { const card = document.createElement("article"); card.className = "cart-item"; const details = document.createElement("div"); details.append(text("h2", item.name), text("p", `Артикул: ${item.article} · Количество: ${item.quantity}`)); card.append(details, text("strong", `${item.unit_price} ${data.currency} за единицу`)); list.append(card); } list.append(text("strong", `Итого: ${data.total} ${data.currency}`)); }).catch(error => { notice.textContent = error.message; }); })();
</script></body></html>
